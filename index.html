<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revalida 2026.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020408; color: #f1f5f9; }
        
        /* iOS Fix: Evita zoom automático ao focar em inputs */
        input[type="text"], input[type="number"] { font-size: 16px !important; }

        /* Estilo Liquid Glass / iOS Pro */
        .liquid-card {
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .liquid-input {
            background: rgba(5, 7, 10, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
        }

        .liquid-input:focus {
            border-color: #10b981;
            outline: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
        }

        /* Checkbox Personalizado (Branco -> Verde Esmeralda) */
        .check-task {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .check-task:checked {
            background-color: #10b981;
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .check-task:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: #ffffff;
            font-size: 12px;
        }

        /* Scrollbar suave */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <!-- Luzes de fundo Liquid Glass -->
    <div class="absolute top-0 left-1/4 w-[400px] h-[400px] bg-emerald-600/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[160px] pointer-events-none"></div>

    <!-- Toast de Salvamento -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-emerald-600/90 backdrop-blur-xl text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-semibold border border-emerald-400/30">
        <div class="bg-white/20 p-1.5 rounded-xl"><i class="fa-solid fa-cloud-arrow-up text-white"></i></div>
        <span>Progresso salvo!</span>
    </div>

    <!-- Header -->
    <header class="liquid-card border-b border-white/5 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="bg-gradient-to-tr from-emerald-600 via-teal-500 to-indigo-500 p-3.5 rounded-2xl shadow-xl shadow-emerald-900/30 border border-white/20">
                    <i class="fa-solid fa-user-doctor text-white text-xl"></i>
                </div>
                <div>
                    <span class="bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 text-[11px] font-bold px-3 py-0.5 rounded-full uppercase tracking-wider">Revalida 2026.2</span>
                    <h1 class="text-xl font-extrabold tracking-tight text-white mt-0.5">Painel de Estudos</h1>
                </div>
            </div>
            <button onclick="resetData()" class="text-xs bg-neutral-900/80 hover:bg-rose-950/40 text-neutral-400 hover:text-rose-400 border border-white/10 px-4 py-2.5 rounded-xl transition-all">
                <i class="fa-solid fa-rotate-right mr-2"></i> Limpar Dados
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 mt-8 space-y-8 relative z-10">
        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="liquid-card p-6 rounded-3xl">
                <p class="text-xs font-semibold text-neutral-400 uppercase">Progresso Geral</p>
                <h3 id="progress-text-card" class="text-3xl font-extrabold text-white mt-1">0%</h3>
                <div class="mt-5 w-full bg-black/60 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/5"><div id="progress-bar" class="bg-gradient-to-r from-teal-500 to-emerald-400 h-full w-0 transition-all duration-500 rounded-full"></div></div>
            </div>
            <div class="liquid-card p-6 rounded-3xl">
                <p class="text-xs font-semibold text-neutral-400 uppercase">Foco na Prova</p>
                <h3 class="text-3xl font-extrabold text-emerald-400 mt-1">Edição 2026.2</h3>
            </div>
            <div class="liquid-card p-6 rounded-3xl">
                <p class="text-xs font-semibold text-neutral-400 uppercase">Meta Diária</p>
                <h3 class="text-3xl font-extrabold text-teal-400 mt-1">50 Questões</h3>
            </div>
        </div>

        <!-- Tabela Checklist Completa -->
        <section class="liquid-card rounded-3xl shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-black/40 text-neutral-400 uppercase text-[10px] font-bold border-b border-white/5">
                            <th class="p-4 pl-6">Data</th>
                            <th class="p-4">Dia</th>
                            <th class="p-4">Prova / Atividade</th>
                            <th class="p-4">Questões</th>
                            <th class="p-4 text-center">Fez?</th>
                            <th class="p-4 text-center">Corrigiu?</th>
                            <th class="p-4 text-center">Acertos</th>
                            <th class="p-4 pr-6">Erros</th>
                        </tr>
                    </thead>
                    <tbody id="checklist-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>

        <!-- Tabela Evolução com Cores Dinâmicas -->
        <section class="liquid-card rounded-3xl shadow-2xl overflow-hidden p-6">
            <h2 class="text-base font-bold text-white mb-6 flex items-center gap-2"><i class="fa-solid fa-chart-line text-emerald-400"></i> Controle de Evolução</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-black/40 text-neutral-400 uppercase text-[10px] font-bold border-b border-white/5">
                            <th class="p-4 pl-6">Prova</th>
                            <th class="p-4 text-center">Acertos / 100</th>
                            <th class="p-4 text-center">Desempenho</th>
                            <th class="p-4 pr-6">Observações</th>
                        </tr>
                    </thead>
                    <tbody id="evolution-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const scheduleData = [
            { date: "12/08/2026", day: "Qua", activity: "REVALIDA 2020", q: "1-50" },
            { date: "13/08/2026", day: "Qui", activity: "REVALIDA 2020", q: "51-100" },
            { date: "14/08/2026", day: "Sex", activity: "REVALIDA 2021", q: "1-50" },
            { date: "15/08/2026", day: "Sáb", activity: "REVALIDA 2021", q: "51-100" },
            { date: "16/08/2026", day: "Dom", activity: "REVISÃO 2020-2021", q: "-" },
            { date: "17/08/2026", day: "Seg", activity: "REVALIDA 2022/1", q: "1-50" },
            { date: "18/08/2026", day: "Ter", activity: "REVALIDA 2022/1", q: "51-100" },
            { date: "19/08/2026", day: "Qua", activity: "REVALIDA 2022/2", q: "1-50" },
            { date: "20/08/2026", day: "Qui", activity: "REVALIDA 2022/2", q: "51-100" },
            { date: "21/08/2026", day: "Sex", activity: "REVISÃO 2022", q: "-" },
            { date: "22/08/2026", day: "Sáb", activity: "REVALIDA 2023/1", q: "1-50" },
            { date: "23/08/2026", day: "Dom", activity: "REVALIDA 2023/1", q: "51-100" },
            { date: "24/08/2026", day: "Seg", activity: "REVALIDA 2023/2", q: "1-50" },
            { date: "25/08/2026", day: "Ter", activity: "REVALIDA 2023/2", q: "51-100" },
            { date: "26/08/2026", day: "Qua", activity: "REVISÃO 2023", q: "-" },
            { date: "27/08/2026", day: "Qui", activity: "REVALIDA 2024/1", q: "1-50" },
            { date: "28/08/2026", day: "Sex", activity: "REVALIDA 2024/1", q: "51-100" },
            { date: "29/08/2026", day: "Sáb", activity: "REVALIDA 2024/2", q: "1-50" },
            { date: "30/08/2026", day: "Dom", activity: "REVALIDA 2024/2", q: "51-100" },
            { date: "31/08/2026", day: "Seg", activity: "REVISÃO 2024", q: "-" },
            { date: "01/09/2026", day: "Ter", activity: "REVALIDA 2025/1", q: "1-50" },
            { date: "02/09/2026", day: "Qua", activity: "REVALIDA 2025/1", q: "51-100" },
            { date: "03/09/2026", day: "Qui", activity: "REVALIDA 2025/2", q: "1-50" },
            { date: "04/09/2026", day: "Sex", activity: "REVALIDA 2025/2", q: "51-100" },
            { date: "05/09/2026", day: "Sáb", activity: "REVISÃO 2025", q: "-" },
            { date: "06/09/2026", day: "Dom", activity: "REVALIDA 2026/1", q: "1-50" },
            { date: "07/09/2026", day: "Seg", activity: "REVALIDA 2026/1", q: "51-100" },
            { date: "08/09/2026", day: "Ter", activity: "REVISÃO GERAL", q: "-" },
            { date: "09/09/2026", day: "Qua", activity: "DIA DOS ERROS", q: "-" },
            { date: "10/09/2026", day: "Qui", activity: "REVISÃO FINAL + DESCANSO", q: "-" }
        ];

        const evolutionData = ["2020", "2021", "2022/1", "2022/2", "2023/1", "2023/2", "2024/1", "2024/2", "2025/1", "2025/2", "2026/1"];

        function renderTables() {
            const tbody = document.getElementById('checklist-body');
            tbody.innerHTML = '';
            scheduleData.forEach((item, index) => {
                const isRevision = item.activity.includes("REVISÃO") || item.activity.includes("ERROS");
                const tr = document.createElement('tr');
                
                // Linha com destaque especial e borda lateral para os dias de revisão
                tr.className = isRevision 
                    ? "bg-amber-500/10 border-l-4 border-amber-400 hover:bg-amber-500/20 transition-all shadow-inner" 
                    : "hover:bg-white/[0.02] transition-colors";
                
                tr.innerHTML = `
                    <td class="p-4 pl-6 text-neutral-400 text-xs">${item.date}</td>
                    <td class="p-4 text-neutral-500 text-xs font-semibold">${item.day}</td>
                    <td class="p-4 font-bold ${isRevision ? 'text-amber-300 flex items-center gap-2' : 'text-emerald-300'} text-xs">
                        ${isRevision ? '<span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[9px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fa-solid fa-rotate mr-1"></i> Revisão</span>' : ''}
                        <span>${item.activity}</span>
                    </td>
                    <td class="p-4 text-neutral-400 text-xs font-mono">${item.q}</td>
                    <td class="p-4 text-center"><input type="checkbox" id="fez_${index}" onchange="saveAndCalculate()" class="check-task"></td>
                    <td class="p-4 text-center"><input type="checkbox" id="corrigiu_${index}" onchange="saveAndCalculate()" class="check-task"></td>
                    <td class="p-4 text-center"><input type="number" id="acertos_${index}" oninput="saveAndCalculate()" placeholder="-" class="w-16 liquid-input rounded-lg text-center py-1 text-xs font-bold"></td>
                    <td class="p-4 pr-6"><input type="text" id="erros_${index}" oninput="saveAndCalculate()" placeholder="Anotações..." class="w-full liquid-input rounded-lg px-2 py-1 text-xs"></td>
                `;
                tbody.appendChild(tr);
            });

            const evoBody = document.getElementById('evolution-body');
            evoBody.innerHTML = '';
            evolutionData.forEach((exam, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 pl-6 font-bold text-emerald-300 text-xs">Prova ${exam}</td>
                    <td class="p-4 text-center font-bold text-white text-xs" id="evo_acertos_${index}">-</td>
                    <td class="p-4 text-center font-extrabold text-xs text-neutral-400" id="evo_pct_${index}">-</td>
                    <td class="p-4 pr-6"><input type="text" id="evo_obs_${index}" oninput="saveAndCalculate()" placeholder="Observações..." class="w-full liquid-input rounded-lg px-3 py-1 text-xs"></td>
                `;
                evoBody.appendChild(tr);
            });
            loadData();
        }

        function updateEvolutionFromChecklist() {
            evolutionData.forEach((exam, evoIndex) => {
                let totalAcertos = 0;
                let hasInput = false;

                scheduleData.forEach((item, schedIndex) => {
                    if (item.activity.includes(exam)) {
                        const valStr = document.getElementById(`acertos_${schedIndex}`).value;
                        if (valStr !== "") {
                            const val = parseFloat(valStr);
                            if (!isNaN(val)) {
                                totalAcertos += val;
                                hasInput = true;
                            }
                        }
                    }
                });

                const acertosElement = document.getElementById(`evo_acertos_${evoIndex}`);
                const pctElement = document.getElementById(`evo_pct_${evoIndex}`);

                if (hasInput) {
                    acertosElement.innerText = totalAcertos;
                    pctElement.innerText = totalAcertos.toFixed(1) + '%';
                    
                    // Lógica de Cores Dinâmicas (Vermelho, Amarelo, Verde)
                    pctElement.className = "p-4 text-center font-extrabold text-xs";
                    if (totalAcertos < 60) {
                        pctElement.classList.add('text-rose-400');
                    } else if (totalAcertos <= 70) {
                        pctElement.classList.add('text-amber-400');
                    } else {
                        pctElement.classList.add('text-emerald-400');
                    }
                } else {
                    acertosElement.innerText = '-';
                    pctElement.innerText = '-';
                    pctElement.className = "p-4 text-center font-extrabold text-xs text-neutral-400";
                }
            });
        }

        function saveAndCalculate() {
            const data = {};
            scheduleData.forEach((_, index) => {
                data[`fez_${index}`] = document.getElementById(`fez_${index}`).checked;
                data[`corrigiu_${index}`] = document.getElementById(`corrigiu_${index}`).checked;
                data[`acertos_${index}`] = document.getElementById(`acertos_${index}`).value;
                data[`erros_${index}`] = document.getElementById(`erros_${index}`).value;
            });
            evolutionData.forEach((_, index) => {
                data[`evo_obs_${index}`] = document.getElementById(`evo_obs_${index}`).value;
            });
            localStorage.setItem('revalida_pro_2026_2_data', JSON.stringify(data));
            
            updateProgress();
            updateEvolutionFromChecklist();
            
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2000);
        }

        function loadData() {
            const saved = localStorage.getItem('revalida_pro_2026_2_data');
            if (!saved) return;
            const data = JSON.parse(saved);
            scheduleData.forEach((_, index) => {
                if (data[`fez_${index}`] !== undefined) document.getElementById(`fez_${index}`).checked = data[`fez_${index}`];
                if (data[`corrigiu_${index}`] !== undefined) document.getElementById(`corrigiu_${index}`).checked = data[`corrigiu_${index}`];
                if (data[`acertos_${index}`] !== undefined) document.getElementById(`acertos_${index}`).value = data[`acertos_${index}`];
                if (data[`erros_${index}`] !== undefined) document.getElementById(`erros_${index}`).value = data[`erros_${index}`];
            });
            evolutionData.forEach((_, index) => {
                if (data[`evo_obs_${index}`] !== undefined) document.getElementById(`evo_obs_${index}`).value = data[`evo_obs_${index}`];
            });
            updateProgress();
            updateEvolutionFromChecklist();
        }

        function updateProgress() {
            let totalTasks = scheduleData.length * 2, completed = 0;
            scheduleData.forEach((_, index) => {
                if (document.getElementById(`fez_${index}`).checked) completed++;
                if (document.getElementById(`corrigiu_${index}`).checked) completed++;
            });
            let percentage = Math.round((completed / totalTasks) * 100);
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-text-card').innerText = percentage + '%';
        }

        function resetData() {
            if (confirm("Limpar todos os dados?")) {
                localStorage.removeItem('revalida_pro_2026_2_data');
                location.reload();
            }
        }
        window.onload = renderTables;
    </script>
</body>
</html>
